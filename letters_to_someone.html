    /* ============================================================================
       1. SYNTHESIZED WEB AUDIO SOUND ENGINE (Never autoplays, tactile stationery SFX)
       ============================================================================ */
    class StationeryAudioEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.sfxEnabled = true;
        this.ambienceEnabled = false;
        this.volume = 0.45;
        this.ambienceNodes = null;
      }

      ensureContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playWaxCrack() {
        if (this.muted || !this.sfxEnabled) return;
        try {
          this.ensureContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          // Crisp organic snap
          const bufferSize = this.ctx.sampleRate * 0.14;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            const env = Math.exp(-i / (this.ctx.sampleRate * 0.025));
            data[i] = (Math.random() * 2 - 1) * env;
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1450, now);
          filter.Q.setValueAtTime(2.4, now);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(this.volume * 0.55, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(now);
        } catch (e) {}
      }

      playPaperRustle() {
        if (this.muted || !this.sfxEnabled) return;
        try {
          this.ensureContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const duration = 0.45;
          const bufferSize = this.ctx.sampleRate * duration;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);

          for (let i = 0; i < bufferSize; i++) {
            const t = i / bufferSize;
            const env = Math.sin(t * Math.PI) * (0.6 + 0.4 * Math.sin(t * 28));
            data[i] = (Math.random() * 2 - 1) * env;
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(900, now);

          const lowpass = this.ctx.createBiquadFilter();
          lowpass.type = 'lowpass';
          lowpass.frequency.setValueAtTime(3400, now);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(this.volume * 0.28, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          noise.connect(filter);
          filter.connect(lowpass);
          lowpass.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(now);
        } catch (e) {}
      }

      playSoftChime() {
        if (this.muted || !this.sfxEnabled) return;
        try {
          this.ensureContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const freqs = [523.25, 659.25, 783.99];
          freqs.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.0001, now + idx * 0.08);
            gain.gain.linearRampToValueAtTime(this.volume * 0.12, now + idx * 0.08 + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 1.1);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 1.15);
          });
        } catch (e) {}
      }

      toggleAmbience(enable) {
        this.ambienceEnabled = enable;
        if (!enable || this.muted) {
          this.stopAmbience();
          return;
        }
        try {
          this.ensureContext();
          if (!this.ctx || this.ambienceNodes) return;

          // Gentle soft rain + warm harmonic pad
          const bufferSize = this.ctx.sampleRate * 3;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          let lastOut = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            data[i] = (lastOut + 0.04 * white) / 1.04;
            lastOut = data[i];
            data[i] *= 2.5;
          }

          const rainSource = this.ctx.createBufferSource();
          rainSource.buffer = buffer;
          rainSource.loop = true;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(850, this.ctx.currentTime);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(this.volume * 0.16, this.ctx.currentTime);

          rainSource.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          rainSource.start();

          this.ambienceNodes = { rainSource, gain };
        } catch (e) {}
      }

      stopAmbience() {
        if (this.ambienceNodes) {
          try {
            this.ambienceNodes.rainSource.stop();
            this.ambienceNodes.rainSource.disconnect();
          } catch (e) {}
          this.ambienceNodes = null;
        }
      }

      updateVolume(val) {
        this.volume = val;
        if (this.ambienceNodes && this.ctx) {
          this.ambienceNodes.gain.gain.setValueAtTime(this.muted ? 0 : val * 0.16, this.ctx.currentTime);
        }
      }

      setMuted(m) {
        this.muted = m;
        if (m) {
          this.stopAmbience();
        } else if (this.ambienceEnabled) {
          this.toggleAmbience(true);
        }
      }
    }

        setStage('cracking');
        soundEngine.playWaxCrack();

        const t1 = setTimeout(() => {
          setStage('opening');
          soundEngine.playPaperRustle();
        }, 550);

        const t2 = setTimeout(() => {
          setStage('sliding');
        }, 1150);

        const t3 = setTimeout(() => {
          setStage('reading');
        }, 1700);

        return () => {
          clearTimeout(t1);
          clearTimeout(t2);
          clearTimeout(t3);
        };
      }, []);

      useEffect(() => {
        if (!letter) return;
        setReplyText('');
        setReplySubmitted(false);
        setShowReplyBox(false);
        const cleanup = triggerOpenSequence();
        return cleanup;

        const handleKey = (e) => {

      const handleToggleAmbience = () => {
        const next = !ambience;
        setAmbience(next);
        if (next && muted) {
          setMuted(false);
          soundEngine.setMuted(false);
        }
        soundEngine.toggleAmbience(next);
      };

      const handleToggleMute = () => {
        const next = !muted;
        setMuted(next);
        soundEngine.setMuted(next);
      };

      return (
        <div className="fixed bottom-20 md:bottom-6 right-4 z-40">
          {open && (
            <div className="mb-2.5 w-64 rounded-2xl bg-paper-white/95 backdrop-blur-md border border-paper-rose/50 p-4 shadow-paper text-xs">

                  onClick={handleToggleMute}

                      setSfx(e.target.checked);

                    }}
                    className="accent-paper-burgundy"
                  />
                </label>

                  <span className="text-paper-text">Soft Window Rain</span>

                    max="1"

                      soundEngine.updateVolume(v);

                    className="w-full accent-paper-burgundy"

              </div>
            </div>

    /* ============================================================================
       8. EXPLORE LETTERS & CATEGORIES PAGE (Plus Postcards & Memory Box)
       ============================================================================ */
    const ExplorePage = ({ letters, onOpenLetter, savedIds, onToggleSave }) => {
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [sortBy, setSortBy] = useState('featured');

      const activeCategoryMeta = useMemo(
        () => CATEGORIES.find((c) => c.id === selectedCategory),
        [selectedCategory]
      );

      const filteredLetters = useMemo(() => {
        let list = [...letters];

        if (selectedCategory !== 'All') {
          list = list.filter((l) => l.category === selectedCategory);
        }

        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          list = list.filter(
            (l) =>
              l.title.toLowerCase().includes(q) ||
              l.content.toLowerCase().includes(q) ||
              l.category.toLowerCase().includes(q) ||
              (l.recipient && l.recipient.toLowerCase().includes(q))
          );
        }

        if (sortBy === 'loved') {
          list.sort((a, b) => (b.loves || 0) - (a.loves || 0));
        } else if (sortBy === 'recent') {
          list.sort((a, b) => b.id - a.id);
        } else if (sortBy === 'random') {
          list.sort(() => Math.random() - 0.5);
        } else {
          list.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
        }

        return list;
      }, [letters, selectedCategory, searchQuery, sortBy]);

      return (

    /* ============================================================================
