    const SurpriseMePage = ({ letters, onOpenLetter }) => {
      const [seenIds, setSeenIds] = useState([]);
      const [currentDraw, setCurrentDraw] = useState(() => letters[0]);
      const [gratitudeShown, setGratitudeShown] = useState(false);

      const drawAnother = () => {
        setGratitudeShown(false);
        let pool = letters.filter((l) => !seenIds.includes(l.id) && l.id !== currentDraw?.id);
        if (pool.length === 0) {
          setSeenIds([]);
          pool = letters.filter((l) => l.id !== currentDraw?.id);
        }
        const chosen = pool[Math.floor(Math.random() * pool.length)] || letters[0];
        setCurrentDraw(chosen);
        setSeenIds((prev) => [...prev, chosen.id]);
        soundEngine.playPaperRustle();
      };

      return (
        <div className="max-w-3xl mx-auto px-4 sm:px-6 py-12 pb-24 text-center">
          <p className="text-xs uppercase tracking-[0.2em] text-paper-burgundy">
            Serendipity
          </p>
          <h1 className="mt-2 font-serif italic text-4xl sm:text-5xl text-paper-text">
            Give me a letter I didn’t know I needed
          </h1>
          <p className="mt-3 text-sm sm:text-base text-paper-brown max-w-lg mx-auto">
            We won’t repeat an envelope during your visit until you’ve explored the entire drawer.
          </p>

          {currentDraw && (
            <div className="mt-10 max-w-md mx-auto">
              <div
                onClick={() => onOpenLetter(currentDraw)}
                role="button"
                tabIndex={0}
                onKeyDown={(e) => e.key === 'Enter' && onOpenLetter(currentDraw)}
                style={{ backgroundColor: currentDraw.envelopeColor || '#F1DCE1' }}
                className="group cursor-pointer rounded-3xl border border-paper-brown/20 p-8 sm:p-10 shadow-envelope hover:shadow-envelope-hover hover:-translate-y-1.5 transition-all"
              >
                <span className="inline-block px-3.5 py-1 rounded-full bg-paper-white/80 text-xs text-paper-burgundy mb-4">
                  {currentDraw.category}
                </span>
                <div className="my-4 flex justify-center">
                  <div className="group-hover:scale-110 transition-transform duration-500">
                    <WaxSealSVG color={currentDraw.sealColor || '#754B55'} size={62} />
                  </div>
                </div>
                <p className="font-hand text-3xl text-paper-burgundy mt-3">
                  {currentDraw.recipient || 'For you'}
                </p>
                <h2 className="font-serif italic text-2xl text-paper-text mt-1">
                  {currentDraw.title}
                </h2>
                <p className="mt-4 text-xs uppercase tracking-widest text-paper-burgundy font-medium">
                  Tap envelope to break seal →
                </p>
              </div>

              <div className="mt-7 flex flex-wrap items-center justify-center gap-3">
                <button
                  type="button"
                  onClick={drawAnother}
                  className="px-6 py-3 rounded-full bg-paper-burgundy text-paper-white text-xs font-medium tracking-wider uppercase hover:opacity-95 transition"
                >
                  Another Letter
                </button>
                <button
                  type="button"
                  onClick={() => {
                    setGratitudeShown(true);
                    soundEngine.playSoftChime();
                  }}
                  className="px-5 py-3 rounded-full bg-paper-white text-paper-text border border-paper-rose/60 text-xs font-medium hover:border-paper-burgundy transition"
                >
                  This was exactly what I needed
                </button>
              </div>

              {gratitudeShown && (
                <p className="mt-5 font-serif italic text-lg text-paper-burgundy animate-paper-unfold">
                  We are so glad these words found you at the right moment. 🌷
                </p>
              )}
            </div>
          )}
        </div>
      );
    };

    /* ============================================================================
       10. WRITE A LETTER & LETTER TO THE FUTURE EDITOR
       ============================================================================ */
    const WriteLetterPage = ({
      onSavePersonal,
      onSubmitCommunity,
      editingDraft,
      onClearEditing
    }) => {
      const [title, setTitle] = useState('');
      const [recipient, setRecipient] = useState('');
      const [category, setCategory] = useState('Friendship');
      const [content, setContent] = useState('');
      const [signature, setSignature] = useState('');
      const [stationery, setStationery] = useState('cream');
      const [envelopeColor, setEnvelopeColor] = useState('#F1DCE1');
      const [sealColor, setSealColor] = useState('#754B55');
      const [useHandFont, setUseHandFont] = useState(true);

      // Privacy mode: 'private' | 'future' | 'community'
      const [privacyMode, setPrivacyMode] = useState('private');
      const [futurePreset, setFuturePreset] = useState('6m');
      const [customFutureDate, setCustomFutureDate] = useState('');
      const [communityConsent, setCommunityConsent] = useState(false);

      const [previewOpen, setPreviewOpen] = useState(false);
      const [statusMessage, setStatusMessage] = useState(null);
      const [errorMessage, setErrorMessage] = useState('');
      const [autosaveStatus, setAutosaveStatus] = useState('');

      // Load draft if editing
      useEffect(() => {
        if (editingDraft) {
          setTitle(editingDraft.title || '');
          setRecipient(editingDraft.recipient || '');
          setCategory(editingDraft.category || 'Friendship');
          setContent(editingDraft.content || '');
          setSignature(editingDraft.signature || '');
          setStationery(editingDraft.stationery || 'cream');
          setEnvelopeColor(editingDraft.envelopeColor || '#F1DCE1');
          setSealColor(editingDraft.sealColor || '#754B55');
          setPrivacyMode(editingDraft.privacyMode || 'private');
        }
      }, [editingDraft]);

      // Gentle autosave indicator to localStorage scratchpad
      useEffect(() => {
        if (!title && !content) return;
        const timer = setTimeout(() => {
          try {
            localStorage.setItem(
              'lts_scratchpad',
              JSON.stringify({ title, recipient, category, content, signature, stationery })
            );
            setAutosaveStatus('Draft saved locally');
          } catch (e) {}
        }, 900);
        return () => clearTimeout(timer);
      }, [title, recipient, category, content, signature, stationery]);

      const wordCount = useMemo(() => {
        const trimmed = content.trim();
        return trimmed ? trimmed.split(/\s+/).length : 0;
      }, [content]);

      const computeDeliveryDate = () => {
        const d = new Date();
        if (futurePreset === '1m') d.setMonth(d.getMonth() + 1);
        else if (futurePreset === '6m') d.setMonth(d.getMonth() + 6);
        else if (futurePreset === '1y') d.setFullYear(d.getFullYear() + 1);
        else if (futurePreset === '5y') d.setFullYear(d.getFullYear() + 5);
        else if (futurePreset === 'custom' && customFutureDate) return customFutureDate;
        return d.toISOString().split('T')[0];
      };

      // Basic moderation / PII filter for public community letters
      const validateCommunitySubmission = (text) => {
        const emailRegex = /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i;
        const phoneRegex = /(\+?\d{1,3}[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}/;
        if (emailRegex.test(text) || phoneRegex.test(text)) {
          return 'For your safety, please remove email addresses or phone numbers before submitting to the public community.';
        }
        return null;
      };

      const handleAction = (isDraftOnly = false) => {
        setErrorMessage('');
        setStatusMessage(null);

        if (!title.trim() || !content.trim()) {
          setErrorMessage('Please give your letter a title and write a few words before sealing it.');
          return;
        }

        const fullContent = signature.trim()
          ? `${content.trim()}\n\n${signature.trim()}`
          : content.trim();

        if (isDraftOnly) {
          onSavePersonal({
            id: editingDraft?.id || `draft-${Date.now()}`,
            title: title.trim(),
            recipient: recipient.trim(),
            category,
            content: fullContent,
            stationery,
            envelopeColor,
            sealColor,
            status: 'draft',
            createdAt: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
          });
          setStatusMessage('Saved to your Private Drafts in My Letters.');
          soundEngine.playSoftChime();
          return;
        }

        if (privacyMode === 'community') {
          if (!communityConsent) {
            setErrorMessage('Please confirm that you consent to anonymous community review before submitting.');
            return;
          }
          const piiIssue = validateCommunitySubmission(`${title} ${fullContent}`);
          if (piiIssue) {
            setErrorMessage(piiIssue);
            return;
          }
          const randomAlias = ANONYMOUS_ALIASES[Math.floor(Math.random() * ANONYMOUS_ALIASES.length)];
          onSubmitCommunity({
            id: `comm-${Date.now()}`,
            alias: randomAlias,
            title: title.trim(),
            category,
            date: 'Just now',
            stationery,
            content: fullContent,
            appreciations: 1,
            status: 'pending',
            replies: []
          });
          setStatusMessage(
            `Your letter has been submitted anonymously as “${randomAlias}” and is now in the Moderation Queue for review before appearing publicly.`
          );
          soundEngine.playWaxCrack();
        } else if (privacyMode === 'future') {
          const deliveryDate = computeDeliveryDate();
          if (!deliveryDate) {
            setErrorMessage('Please select a valid future delivery date.');
            return;
          }
          onSavePersonal({
            id: editingDraft?.id || `future-${Date.now()}`,
            title: title.trim(),
            recipient: recipient.trim() || 'My Future Self',
            category: 'To My Future Self',
            content: fullContent,
            stationery,
            envelopeColor,
            sealColor,
            status: 'future',
            deliveryDate,
            createdAt: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
          });
          setStatusMessage(`Your time-capsule letter has been sealed until ${deliveryDate} inside My Letters.`);
          soundEngine.playWaxCrack();
        } else {
          onSavePersonal({
            id: editingDraft?.id || `priv-${Date.now()}`,
            title: title.trim(),
            recipient: recipient.trim(),
            category,
            content: fullContent,
            stationery,
            envelopeColor,
            sealColor,
            status: 'private',
            createdAt: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
          });
          setStatusMessage('Your private letter has been sealed and stored safely in My Letters.');
          soundEngine.playWaxCrack();
        }

        if (onClearEditing) onClearEditing();
      };

      const stationeryStyleClass = {
        cream: 'stationery-cream',
        blush: 'stationery-blush',
        lavender: 'stationery-lavender',
        vintage: 'stationery-vintage',
        pressed: 'stationery-pressed'
      }[stationery];

      return (
        <div className="max-w-5xl mx-auto px-4 sm:px-6 py-10 pb-24">
          <div className="text-center max-w-xl mx-auto mb-10">
            <p className="text-xs uppercase tracking-[0.2em] text-paper-burgundy">
              The Writing Desk
            </p>
            <h1 className="mt-2 font-serif italic text-4xl sm:text-5xl text-paper-text">
              Some things are easier to write.
            </h1>
            <p className="mt-2.5 text-sm sm:text-base text-paper-brown">
              Take your time. There is no right way to begin.
            </p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            {/* LEFT: STATIONERY PAPER EDITOR */}
            <div className="lg:col-span-8">
              <div className={`rounded-3xl border p-6 sm:p-9 shadow-paper transition-colors ${stationeryStyleClass}`}>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
                  <div>
                    <label className="block text-xs uppercase tracking-wider text-paper-brown mb-1.5">
                      Letter Title *
                    </label>
                    <input
                      type="text"
                      value={title}
                      onChange={(e) => setTitle(e.target.value)}
                      placeholder="e.g., What I wish I had said..."
                      className="w-full rounded-xl border border-paper-brown/20 bg-paper-white/80 px-4 py-2.5 font-serif italic text-lg text-paper-text focus:outline-none focus:border-paper-burgundy"
                    />
                  </div>

                  <div>
                    <label className="block text-xs uppercase tracking-wider text-paper-brown mb-1.5">
                      To Whom (Optional)
                    </label>
                    <input
                      type="text"
                      value={recipient}
                      onChange={(e) => setRecipient(e.target.value)}
                      placeholder="e.g., To my younger self"
                      className="w-full rounded-xl border border-paper-brown/20 bg-paper-white/80 px-4 py-2.5 font-hand text-2xl text-paper-burgundy focus:outline-none focus:border-paper-burgundy"
                    />
                  </div>
                </div>

                <div className="flex flex-wrap items-center justify-between gap-3 mb-4 pb-4 border-b border-paper-brown/15">
                  <div className="flex items-center gap-2">
                    <label className="text-xs text-paper-brown">Category:</label>
                    <select
                      value={category}
                      onChange={(e) => setCategory(e.target.value)}
                      className="rounded-full border border-paper-brown/25 bg-paper-white/85 px-3.5 py-1 text-xs text-paper-text focus:outline-none focus:border-paper-burgundy"
                    >
                      {CATEGORIES.map((c) => (
                        <option key={c.id} value={c.id}>{c.label}</option>
                      ))}
                      <option value="To My Younger Self">To My Younger Self</option>
                      <option value="To My Future Self">To My Future Self</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>

                  <div className="flex items-center gap-3">
                    <button
                      type="button"
                      onClick={() => setUseHandFont(!useHandFont)}
                      className="text-xs px-3 py-1 rounded-full bg-paper-white/85 border border-paper-brown/20 text-paper-text hover:border-paper-burgundy transition"
                    >
                      {useHandFont ? 'Style: Handwritten' : 'Style: Serif'}
                    </button>
                    {autosaveStatus && (
                      <span className="text-[11px] text-paper-brown italic">{autosaveStatus}</span>
                    )}
                  </div>
                </div>

                {/* Writing Sheet */}
                <textarea
                  rows="11"
                  value={content}
                  onChange={(e) => setContent(e.target.value)}
                  placeholder="Dear..."
                  className={`w-full bg-transparent resize-y focus:outline-none text-paper-text placeholder:text-paper-brown/45 ${
                    useHandFont
                      ? 'font-hand text-2xl sm:text-[27px] leading-[1.65]'
                      : 'font-body text-base sm:text-lg leading-[1.85]'
                  }`}
                />

                {/* Signature Line */}
                <div className="mt-4 pt-4 border-t border-paper-brown/15 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <input
                    type="text"
                    value={signature}
                    onChange={(e) => setSignature(e.target.value)}
                    placeholder="Optional closing & signature (e.g., With warmth, Me)"
                    className="flex-1 rounded-xl border border-paper-brown/20 bg-paper-white/75 px-4 py-2 font-hand text-xl text-paper-burgundy focus:outline-none focus:border-paper-burgundy"
                  />
                  <div className="text-xs text-paper-brown shrink-0">
                    {wordCount} words • {content.length} chars
                  </div>
                </div>
              </div>
            </div>

            {/* RIGHT: STATIONERY CHOICES & PRIVACY DELIVERY */}
            <div className="lg:col-span-4 space-y-5">
              {/* Stationery Paper & Wax Seal Selector */}
              <div className="rounded-2xl bg-paper-white/90 border border-paper-rose/45 p-5 shadow-xs space-y-4">
                <h2 className="font-serif italic text-xl text-paper-text">Stationery & Wax</h2>

                <div>
                  <span className="block text-xs text-paper-brown mb-2">Paper Texture</span>
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    {[
                      { id: 'cream', label: 'Classic Cream' },
                      { id: 'blush', label: 'Blush Pink' },
                      { id: 'lavender', label: 'Lavender' },
                      { id: 'vintage', label: 'Vintage Aged' },
                      { id: 'pressed', label: 'Pressed Flower' }
                    ].map((st) => (
                      <button
                        key={st.id}
                        type="button"
                        onClick={() => setStationery(st.id)}
                        className={`px-3 py-2 rounded-xl border text-left transition ${
                          stationery === st.id
                            ? 'border-paper-burgundy bg-paper-pink/40 font-medium text-paper-burgundy'
                            : 'border-paper-rose/40 bg-paper-bg/50 text-paper-text'
                        }`}
                      >
                        {st.label}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="flex items-center justify-between pt-2">
                  <div>
                    <span className="block text-xs text-paper-brown mb-1.5">Envelope Tint</span>
                    <div className="flex gap-2">
                      {['#F1DCE1', '#F5EADB', '#E8E1F1', '#E9C7CD'].map((clr) => (
                        <button
                          key={clr}
                          type="button"
                          onClick={() => setEnvelopeColor(clr)}
                          style={{ backgroundColor: clr }}
                          aria-label={`Select envelope tint ${clr}`}
                          className={`w-7 h-7 rounded-full border ${
                            envelopeColor === clr ? 'ring-2 ring-paper-burgundy border-white' : 'border-paper-brown/30'
                          }`}
                        />
                      ))}
                    </div>
                  </div>

                  <div>
                    <span className="block text-xs text-paper-brown mb-1.5">Wax Seal</span>
                    <div className="flex gap-2">
                      {['#754B55', '#816B63', '#B57B87', '#8B5E68'].map((clr) => (
                        <button
                          key={clr}
                          type="button"
                          onClick={() => setSealColor(clr)}
                          style={{ backgroundColor: clr }}
                          aria-label={`Select wax seal color ${clr}`}
                          className={`w-7 h-7 rounded-full border ${
                            sealColor === clr ? 'ring-2 ring-paper-text border-white' : 'border-white/60'
                          }`}
                        />
                      ))}
                    </div>
                  </div>
                </div>
              </div>

              {/* Destination & Privacy Mode */}
              <div className="rounded-2xl bg-paper-white/90 border border-paper-rose/45 p-5 shadow-xs space-y-3.5">
                <h2 className="font-serif italic text-xl text-paper-text">Where Should This Go?</h2>

                {[
                  {
                    id: 'private',
                    title: 'Keep Private (My Letters)',
                    desc: 'Stored only on your device inside My Letters. Never shared publicly.'
                  },
                  {
                    id: 'future',
                    title: 'Letter to My Future Self',
                    desc: 'Sealed as a time capsule until your chosen arrival date.'
                  },
                  {
                    id: 'community',
                    title: 'Share Anonymously to Community',
                    desc: 'Assigned a poetic alias and reviewed by moderation before publishing.'
                  }
                ].map((opt) => (
                  <label
                    key={opt.id}
                    className={`block cursor-pointer rounded-xl border p-3.5 transition ${
                      privacyMode === opt.id
                        ? 'border-paper-burgundy bg-paper-pink/35'
                        : 'border-paper-rose/40 bg-paper-bg/40 hover:bg-paper-bg'
                    }`}
                  >
                    <div className="flex items-center gap-2">
                      <input
                        type="radio"
                        name="privacyMode"
                        checked={privacyMode === opt.id}
                        onChange={() => setPrivacyMode(opt.id)}
                        className="accent-paper-burgundy"
                      />
                      <span className="text-xs font-medium text-paper-text">{opt.title}</span>
                    </div>
                    <p className="mt-1 pl-5 text-[11px] text-paper-brown leading-relaxed">
                      {opt.desc}
                    </p>
                  </label>
                ))}

                {/* Future Delivery Date Picker */}
                {privacyMode === 'future' && (
                  <div className="pt-2 pl-2 space-y-2 border-l-2 border-paper-burgundy/40">
                    <span className="block text-xs font-medium text-paper-burgundy">
                      Deliver to My Letters in:
                    </span>
                    <div className="flex flex-wrap gap-1.5">
                      {[
                        { id: '1m', label: '1 Month' },
                        { id: '6m', label: '6 Months' },
                        { id: '1y', label: '1 Year' },
                        { id: '5y', label: '5 Years' },
                        { id: 'custom', label: 'Custom Date' }
                      ].map((fp) => (
                        <button
                          key={fp.id}
                          type="button"
                          onClick={() => setFuturePreset(fp.id)}
                          className={`px-2.5 py-1 rounded-full text-[11px] border ${
                            futurePreset === fp.id
                              ? 'bg-paper-burgundy text-paper-white border-paper-burgundy'
                              : 'bg-paper-white text-paper-text border-paper-rose/50'
                          }`}
                        >
                          {fp.label}
                        </button>
                      ))}
                    </div>
                    {futurePreset === 'custom' && (
                      <input
                        type="date"
                        value={customFutureDate}
                        min={new Date().toISOString().split('T')[0]}
                        onChange={(e) => setCustomFutureDate(e.target.value)}
                        className="w-full rounded-lg border border-paper-rose/60 bg-paper-white px-3 py-1.5 text-xs text-paper-text"
                      />
                    )}
                  </div>
                )}

                {/* Explicit Consent for Community Submission */}
                {privacyMode === 'community' && (
                  <label className="flex items-start gap-2 pt-2 text-[11px] text-paper-brown cursor-pointer">
                    <input
                      type="checkbox"
                      checked={communityConsent}
                      onChange={(e) => setCommunityConsent(e.target.checked)}
                      className="mt-0.5 accent-paper-burgundy"
                    />
                    <span>
                      I understand my letter will be published anonymously after moderation approval and contains no private contact details.
                    </span>
                  </label>
                )}

                {errorMessage && (
                  <p className="text-xs text-red-700 bg-red-50 border border-red-200 rounded-xl p-3">
                    {errorMessage}
                  </p>
                )}

                {statusMessage && (
                  <p className="text-xs text-paper-burgundy bg-paper-pink/45 border border-paper-burgundy/30 rounded-xl p-3 leading-relaxed">
                    {statusMessage}
                  </p>
                )}

                {/* Action Buttons */}
                <div className="pt-2 space-y-2">
                  <button
                    type="button"
                    onClick={() => handleAction(false)}
                    className="w-full py-3 rounded-full bg-paper-burgundy text-paper-white text-xs font-medium tracking-wider uppercase shadow-envelope hover:opacity-95 transition"
                  >
                    {privacyMode === 'community'
                      ? 'Submit Anonymously'
                      : privacyMode === 'future'
                      ? 'Seal Future Letter'
                      : 'Seal & Save Privately'}
                  </button>

                  <div className="grid grid-cols-2 gap-2">
                    <button
                      type="button"
                      onClick={() => handleAction(true)}
                      className="py-2 rounded-full bg-paper-cream text-paper-text border border-paper-brown/20 text-xs font-medium hover:border-paper-burgundy transition"
                    >
                      Save Draft
                    </button>
                    <button
                      type="button"
                      onClick={() => setPreviewOpen(true)}
                      className="py-2 rounded-full bg-paper-white text-paper-text border border-paper-rose/50 text-xs font-medium hover:border-paper-burgundy transition"
                    >
                      Preview Letter
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* Live Preview Modal */}
          {previewOpen && (
            <div
              className="fixed inset-0 z-50 flex items-center justify-center bg-paper-text/45 backdrop-blur-xs p-4"
              onClick={() => setPreviewOpen(false)}
            >
              <div
                className={`max-w-xl w-full rounded-2xl border p-8 shadow-paper ${stationeryStyleClass}`}
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex justify-between items-center pb-4 border-b border-paper-brown/15">
                  <span className="text-xs uppercase tracking-widest text-paper-burgundy">
                    Stationery Preview • {category}
                  </span>
                  <button
                    type="button"
                    onClick={() => setPreviewOpen(false)}
                    className="text-sm text-paper-brown hover:text-paper-burgundy"
                  >
                    Close ✕
                  </button>
                </div>
                <h3 className="mt-4 font-serif italic text-3xl text-paper-text">
                  {title || 'Untitled Letter'}
                </h3>
                {recipient && (
                  <p className="font-hand text-xl text-paper-burgundy mt-1">{recipient}</p>
                )}
                <div className="mt-5 whitespace-pre-line font-hand text-2xl text-paper-text leading-relaxed">
                  {content || 'Your words will appear here...'}
                </div>
                {signature && (
                  <p className="mt-5 font-hand text-2xl text-paper-burgundy">{signature}</p>
                )}
              </div>
            </div>
          )}
        </div>
      );
    };

    /* ============================================================================
       11. COMMUNITY LETTERS & MODERATION QUEUE PAGE
       ============================================================================ */
    const CommunityPage = ({
      communityLetters,
      onOpenLetter,
      onAppreciate,
      onReportLetter,
      onModerateAction,
      onNavigate
    }) => {
      const [activeTab, setActiveTab] = useState('feed'); // 'feed' | 'moderation'
      const [categoryFilter, setCategoryFilter] = useState('All');
      const [search, setSearch] = useState('');
      const [reportedIds, setReportedIds] = useState([]);

      const approvedLetters = useMemo(() => {
        return communityLetters
          .filter((l) => l.status === 'approved')
          .filter((l) => categoryFilter === 'All' || l.category === categoryFilter)
          .filter(
            (l) =>
              !search.trim() ||
              l.title.toLowerCase().includes(search.toLowerCase()) ||
              l.content.toLowerCase().includes(search.toLowerCase())
          );
      }, [communityLetters, categoryFilter, search]);

      const pendingLetters = useMemo(
        () => communityLetters.filter((l) => l.status === 'pending' || l.reported),
        [communityLetters]
      );

      const handleReport = (id) => {
        onReportLetter(id);
        setReportedIds((prev) => [...prev, id]);
      };

      return (
        <div className="max-w-5xl mx-auto px-4 sm:px-6 py-10 pb-24 space-y-10">
          <div className="text-center max-w-2xl mx-auto">
            <p className="text-xs uppercase tracking-[0.2em] text-paper-burgundy">
              Anonymous Exchange
            </p>
            <h1 className="mt-2 font-serif italic text-4xl sm:text-5xl text-paper-text">
              Letters from strangers, written for someone.
            </h1>
            <p className="mt-2.5 text-sm sm:text-base text-paper-brown">
              Sometimes a stranger’s words feel familiar. All community submissions are reviewed before appearing here.
            </p>

            <div className="mt-6 flex flex-wrap items-center justify-center gap-3">
              <button
                type="button"
                onClick={() => onNavigate('write')}
                className="px-6 py-2.5 rounded-full bg-paper-burgundy text-paper-white text-xs font-medium tracking-wider uppercase hover:opacity-95 transition"
              >
                Write an Anonymous Letter
              </button>

              <button
                type="button"
                onClick={() => setActiveTab(activeTab === 'feed' ? 'moderation' : 'feed')}
                className="px-4 py-2.5 rounded-full bg-paper-white border border-paper-rose/60 text-xs font-medium text-paper-text hover:border-paper-burgundy transition"
              >
                {activeTab === 'feed'
                  ? `Moderation Queue (${pendingLetters.length})`
                  : '← Back to Community Wall'}
              </button>
            </div>
          </div>

          {activeTab === 'feed' ? (
            <>
              {/* Filter & Search */}
              <div className="flex flex-col sm:flex-row gap-3 items-center justify-between bg-paper-white/85 border border-paper-rose/45 rounded-2xl p-4">
                <input
                  type="search"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="Search community letters..."
                  className="w-full sm:w-72 rounded-full border border-paper-rose/50 bg-paper-bg/70 px-4 py-2 text-xs text-paper-text focus:outline-none focus:border-paper-burgundy"
                />
                <div className="flex flex-wrap gap-1.5">
                  {['All', 'Hope', 'Missing Someone', 'Family', 'Gratitude', 'Love', 'Friendship'].map((cat) => (
                    <button
                      key={cat}
                      type="button"
                      onClick={() => setCategoryFilter(cat)}
                      className={`px-3 py-1 rounded-full text-xs transition ${
                        categoryFilter === cat
                          ? 'bg-paper-burgundy text-paper-white'
                          : 'bg-paper-bg text-paper-text border border-paper-rose/40'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>
              </div>

              {/* Community Letters Feed */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {approvedLetters.map((item) => (
                  <article
                    key={item.id}
                    className="rounded-2xl bg-paper-white/95 border border-paper-rose/45 p-6 sm:p-7 shadow-envelope flex flex-col justify-between"
                  >
                    <div>
                      <div className="flex items-center justify-between text-xs text-paper-brown mb-3">
                        <span className="font-serif italic text-sm text-paper-burgundy">
                          {item.alias}
                        </span>
                        <span className="px-2.5 py-0.5 rounded-full bg-paper-cream text-[11px]">
                          {item.category}
                        </span>
                      </div>

                      <h2
                        onClick={() => onOpenLetter(item)}
                        className="cursor-pointer font-serif italic text-2xl text-paper-text hover:text-paper-burgundy transition-colors"
                      >
                        {item.title}
                      </h2>

                      <p className="mt-3 font-body text-sm text-paper-text/90 leading-relaxed line-clamp-4 whitespace-pre-line">
                        {item.content}
                      </p>
                    </div>

                    <div className="mt-6 pt-4 border-t border-paper-rose/30 flex items-center justify-between gap-2 text-xs">
                      <div className="flex items-center gap-3">
                        <button
                          type="button"
                          onClick={() => {
                            onAppreciate(item.id);
                            soundEngine.playSoftChime();
                          }}
                          className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-paper-pink/55 text-paper-burgundy hover:bg-paper-pink transition"
                        >
                          <span>♥</span>
                          <span>Send Warmth ({item.appreciations || 0})</span>
                        </button>

                        <button
                          type="button"
                          onClick={() => onOpenLetter(item)}
                          className="text-paper-brown hover:text-paper-burgundy font-medium"
                        >
                          Read full letter
                        </button>
                      </div>

                      <button
                        type="button"
                        onClick={() => handleReport(item.id)}
                        disabled={reportedIds.includes(item.id)}
                        className="text-[11px] text-paper-brown/70 hover:text-paper-burgundy"
                      >
                        {reportedIds.includes(item.id) ? 'Flagged' : 'Report'}
                      </button>
                    </div>
                  </article>
                ))}
              </div>
            </>
          ) : (
            /* MODERATION DASHBOARD VIEW */
            <div className="rounded-3xl bg-paper-white/95 border border-paper-rose/50 p-6 sm:p-8 shadow-paper space-y-6">
              <div className="border-b border-paper-rose/35 pb-4">
                <h2 className="font-serif italic text-2xl sm:text-3xl text-paper-text">
                  Community Moderation Queue
                </h2>
                <p className="text-xs sm:text-sm text-paper-brown mt-1">
                  All user-submitted community letters remain hidden from the public wall until reviewed and approved here.
                </p>
              </div>

              {pendingLetters.length === 0 ? (
                <p className="text-sm text-paper-brown py-8 text-center italic">
                  The moderation queue is clear. Submit an anonymous letter on the Write page to test the approval workflow.
                </p>
              ) : (
                <div className="space-y-4">
                  {pendingLetters.map((sub) => (
                    <div
                      key={sub.id}
                      className="rounded-2xl bg-paper-bg/80 border border-paper-rose/45 p-5 space-y-3"
                    >
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <div>
                          <span className="text-xs uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-900 mr-2">
                            {sub.reported ? 'Reported for Review' : 'Pending Approval'}
                          </span>
                          <span className="text-xs text-paper-brown">
                            Alias: <strong>{sub.alias}</strong> • {sub.category}
                          </span>
                        </div>
                      </div>

                      <h3 className="font-serif italic text-xl text-paper-text">{sub.title}</h3>
                      <p className="text-sm font-body text-paper-text/90 whitespace-pre-line bg-paper-white/80 p-3.5 rounded-xl border border-paper-rose/30">
                        {sub.content}
                      </p>

                      <div className="flex flex-wrap gap-2 pt-1">
                        <button
                          type="button"
                          onClick={() => onModerateAction(sub.id, 'approve')}
                          className="px-4 py-1.5 rounded-full bg-paper-burgundy text-paper-white text-xs font-medium"
                        >
                          Approve & Publish
                        </button>
                        <button
                          type="button"
                          onClick={() => onModerateAction(sub.id, 'reject')}
                          className="px-4 py-1.5 rounded-full bg-paper-white border border-paper-brown/30 text-paper-text text-xs font-medium hover:bg-red-50"
                        >
                          Reject / Remove
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    /* ============================================================================
       12. MY LETTERS — PERSONAL LETTER BOX & TIME CAPSULES
       ============================================================================ */
    const MyLettersPage = ({
      allLetters,
      savedIds,
      personalLetters,
      onOpenLetter,
      onToggleSave,
      onDeletePersonal,
      onEditDraft,
      onNavigate
    }) => {
      const [tab, setTab] = useState('saved'); // 'saved' | 'written' | 'drafts' | 'future'
      const todayISO = new Date().toISOString().split('T')[0];

      const savedList = useMemo(
        () => allLetters.filter((l) => savedIds.includes(l.id)),
        [allLetters, savedIds]
      );

      const writtenList = useMemo(
        () => personalLetters.filter((l) => l.status === 'private'),
        [personalLetters]
      );

      const draftsList = useMemo(
        () => personalLetters.filter((l) => l.status === 'draft'),
        [personalLetters]
      );

      const futureList = useMemo(
        () => personalLetters.filter((l) => l.status === 'future'),
        [personalLetters]
      );

      return (
        <div className="max-w-5xl mx-auto px-4 sm:px-6 py-10 pb-24 space-y-10">
          <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-4 border-b border-paper-rose/40 pb-6">
            <div>
              <p className="text-xs uppercase tracking-[0.2em] text-paper-burgundy">
                Personal Keepsake Box
              </p>
              <h1 className="mt-1 font-serif italic text-4xl sm:text-5xl text-paper-text">
                My Letters
              </h1>
              <p className="mt-1.5 text-sm text-paper-brown">
                Stored privately in your browser. Only you can open your private and future letters.
              </p>
            </div>

            <button
              type="button"
              onClick={() => onNavigate('write')}
              className="self-start sm:self-auto px-6 py-2.5 rounded-full bg-paper-burgundy text-paper-white text-xs font-medium tracking-wider uppercase hover:opacity-95 transition"
            >
              + Write New Letter
            </button>
          </div>

          {/* Drawer Tabs */}
          <div className="flex flex-wrap gap-2">
            {[
              { id: 'saved', label: `Saved Favorites (${savedList.length})` },
              { id: 'written', label: `Private Letters (${writtenList.length})` },
              { id: 'drafts', label: `Drafts (${draftsList.length})` },
              { id: 'future', label: `Future Time-Capsules (${futureList.length})` }
            ].map((t) => (
              <button
                key={t.id}
                type="button"
                onClick={() => setTab(t.id)}
                className={`px-4 py-2 rounded-full text-xs font-medium transition ${
                  tab === t.id
                    ? 'bg-paper-burgundy text-paper-white'
                    : 'bg-paper-white/85 text-paper-text border border-paper-rose/45 hover:border-paper-burgundy'
                }`}
              >
                {t.label}
              </button>
            ))}
          </div>

          {/* SAVED TAB */}
          {tab === 'saved' && (
            savedList.length === 0 ? (
              <div className="text-center py-14 rounded-2xl bg-paper-white/75 border border-paper-rose/40">
                <p className="font-serif italic text-2xl text-paper-text">Your saved box is empty.</p>
                <p className="text-sm text-paper-brown mt-1">
                  Tap the heart icon on any envelope while reading to keep it close.
                </p>
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {savedList.map((l) => (
                  <EnvelopeCard
                    key={l.id}
                    letter={l}
                    onOpen={onOpenLetter}
                    isSaved={true}
                    onToggleSave={onToggleSave}
                  />
                ))}
              </div>
            )
          )}

          {/* PRIVATE WRITTEN TAB */}
          {tab === 'written' && (
            writtenList.length === 0 ? (
              <div className="text-center py-14 rounded-2xl bg-paper-white/75 border border-paper-rose/40">
                <p className="font-serif italic text-2xl text-paper-text">No private letters sealed yet.</p>
                <button
                  type="button"
                  onClick={() => onNavigate('write')}
                  className="mt-4 px-5 py-2 rounded-full bg-paper-burgundy text-paper-white text-xs uppercase tracking-wider"
                >
                  Write Your First Letter
                </button>
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                {writtenList.map((l) => (
                  <div key={l.id} className="rounded-2xl bg-paper-white/95 border border-paper-rose/45 p-6 shadow-xs flex flex-col justify-between">
                    <div>
                      <div className="flex justify-between text-xs text-paper-brown mb-2">
                        <span>{l.category}</span>
                        <span>{l.createdAt}</span>
                      </div>
                      <h3 className="font-serif italic text-2xl text-paper-text">{l.title}</h3>
                      <p className="mt-2 font-hand text-xl text-paper-text/85 line-clamp-3">{l.content}</p>
                    </div>
                    <div className="mt-5 pt-3 border-t border-paper-rose/30 flex justify-between items-center text-xs">
                      <button
                        type="button"
                        onClick={() => onOpenLetter(l)}
                        className="font-medium text-paper-burgundy hover:underline"
                      >
                        Unseal & Read →
                      </button>
                      <button
                        type="button"
                        onClick={() => onDeletePersonal(l.id)}
                        className="text-paper-brown/70 hover:text-red-700"
                      >
                        Delete
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )
          )}

          {/* DRAFTS TAB */}
          {tab === 'drafts' && (
            draftsList.length === 0 ? (
              <div className="text-center py-14 rounded-2xl bg-paper-white/75 border border-paper-rose/40">
                <p className="font-serif italic text-2xl text-paper-text">No unfinished drafts.</p>
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                {draftsList.map((d) => (
                  <div key={d.id} className="rounded-2xl bg-paper-cream/80 border border-paper-brown/20 p-6 flex flex-col justify-between">
                    <div>
                      <span className="text-[11px] uppercase tracking-wider text-paper-brown">
                        Draft • {d.createdAt}
                      </span>
                      <h3 className="font-serif italic text-2xl text-paper-text mt-1">{d.title}</h3>
                      <p className="mt-2 text-sm text-paper-brown line-clamp-3">{d.content}</p>
                    </div>
                    <div className="mt-5 pt-3 border-t border-paper-brown/15 flex justify-between text-xs">
                      <button
                        type="button"
                        onClick={() => onEditDraft(d)}
                        className="font-medium text-paper-burgundy hover:underline"
                      >
                        Continue Writing →
                      </button>
                      <button
                        type="button"
                        onClick={() => onDeletePersonal(d.id)}
                        className="text-paper-brown/70 hover:text-red-700"
                      >
                        Discard
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )
          )}

          {/* FUTURE TIME-CAPSULE TAB */}
          {tab === 'future' && (
            futureList.length === 0 ? (
              <div className="text-center py-14 rounded-2xl bg-paper-white/75 border border-paper-rose/40">
                <p className="font-serif italic text-2xl text-paper-text">
                  No letters waiting in the future yet.
                </p>
                <p className="text-sm text-paper-brown mt-1">
                  Write a letter to the person you will become in 6 months, 1 year, or 5 years.
                </p>
                <button
                  type="button"
                  onClick={() => onNavigate('write')}
                  className="mt-4 px-5 py-2 rounded-full bg-paper-burgundy text-paper-white text-xs uppercase tracking-wider"
                >
                  Write to Future Self
                </button>
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                {futureList.map((f) => {
                  const unlocked = f.deliveryDate <= todayISO;
                  return (
                    <div key={f.id} className="rounded-2xl bg-paper-lavender/65 border border-paper-rose/50 p-6 flex flex-col justify-between">
                      <div>
                        <div className="flex items-center justify-between text-xs mb-2">
                          <span className="px-2.5 py-0.5 rounded-full bg-paper-white text-paper-burgundy font-medium">
                            {unlocked ? 'Arrived Today' : `Sealed until ${f.deliveryDate}`}
                          </span>
                          <span className="text-paper-brown">Written {f.createdAt}</span>
                        </div>
                        <h3 className="font-serif italic text-2xl text-paper-text">{f.title}</h3>
                        <p className="mt-2 text-sm text-paper-brown italic">
                          {unlocked
                            ? 'Your time capsule has arrived and is ready to unseal.'
                            : 'This envelope remains sealed until its scheduled arrival date.'}
                        </p>
                      </div>
                      <div className="mt-5 pt-3 border-t border-paper-brown/15 flex justify-between items-center text-xs">
                        {unlocked ? (
                          <button
                            type="button"
                            onClick={() => onOpenLetter(f)}
                            className="px-4 py-1.5 rounded-full bg-paper-burgundy text-paper-white font-medium"
                          >
                            Open Arrived Letter
                          </button>
                        ) : (
                          <span className="text-paper-brown">🔒 Time-locked</span>
                        )}
                        <button
                          type="button"
                          onClick={() => onDeletePersonal(f.id)}
                          className="text-paper-brown/70 hover:text-red-700"
                        >
                          Delete
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )
          )}
        </div>
      );
    };

    /* ============================================================================
       13. DAILY LETTER, ABOUT & PRIVACY PAGES
       ============================================================================ */
    const DailyLetterPage = ({ dailyLetter, letters, onOpenLetter, savedIds, onToggleSave }) => {
      const recentDailySample = useMemo(() => letters.slice(1, 7), [letters]);

      return (
        <div className="max-w-4xl mx-auto px-4 sm:px-6 py-10 pb-24 space-y-12">
          <div className="text-center max-w-xl mx-auto">
            <p className="text-xs uppercase tracking-[0.2em] text-paper-burgundy">
              One Curated Envelope Each Day
            </p>
            <h1 className="mt-2 font-serif italic text-4xl sm:text-5xl text-paper-text">
              Today’s Letter
            </h1>
            <p className="mt-2 text-sm text-paper-brown">
              Every visitor around the world sees the same daily envelope until midnight.
            </p>
          </div>

          {dailyLetter && (
            <div className="max-w-lg mx-auto">
              <EnvelopeCard
                letter={dailyLetter}
                onOpen={onOpenLetter}
                isSaved={savedIds.includes(dailyLetter.id)}
                onToggleSave={onToggleSave}
              />
            </div>
          )}

          <div className="pt-8 border-t border-paper-rose/40">
            <h2 className="font-serif italic text-2xl text-paper-text mb-5">
              Previous Daily Selections
            </h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
              {recentDailySample.map((l) => (
                <EnvelopeCard
                  key={l.id}
                  letter={l}
                  onOpen={onOpenLetter}
                  compact={true}
                />
              ))}
            </div>
          </div>
        </div>
      );
    };

    const AboutPage = ({ onNavigate }) => (
      <div className="max-w-3xl mx-auto px-4 sm:px-6 py-12 pb-24 space-y-8">
        <div className="rounded-3xl stationery-cream border p-8 sm:p-12 shadow-paper space-y-6">
          <p className="text-xs uppercase tracking-[0.2em] text-paper-burgundy">
            Our Philosophy
          </p>
          <h1 className="font-serif italic text-4xl sm:text-5xl text-paper-text leading-tight">
            Some feelings are easier to write than to say.
          </h1>
          <div className="space-y-4 font-body text-base text-paper-text/90 leading-relaxed">
            <p>
              We all carry a small archive of unsent words: the thank-you we forgot to say before a train departed, the apology pride kept us from speaking, the encouragement our younger self desperately needed to hear.
            </p>
            <p>
              <strong>Letters to Someone</strong> was built as a quiet sanctuary away from noisy feeds, follower counts, and hurried messages. Here, words sit inside sealed envelopes until someone is ready to gently break the wax and read them.
            </p>
            <p>
              Whether you come here to read a letter written by a stranger who feels surprisingly familiar, or to seal a private note to the person you will become five years from now, this desk belongs to you.
            </p>
          </div>
          <div className="pt-4 flex flex-wrap gap-3">
            <button
              type="button"
              onClick={() => onNavigate('home')}
              className="px-6 py-2.5 rounded-full bg-paper-burgundy text-paper-white text-xs font-medium uppercase tracking-wider"
            >
              Return to the Desk
            </button>
            <button
              type="button"
              onClick={() => onNavigate('write')}
              className="px-6 py-2.5 rounded-full bg-paper-white border border-paper-rose/60 text-paper-text text-xs font-medium uppercase tracking-wider"
            >
              Write a Letter
            </button>
          </div>
        </div>
      </div>
    );

    const PrivacyPage = ({ onClearAllLocalData }) => {
      const [cleared, setCleared] = useState(false);

      return (
        <div className="max-w-3xl mx-auto px-4 sm:px-6 py-12 pb-24 space-y-6">
          <div className="rounded-3xl bg-paper-white/95 border border-paper-rose/45 p-8 sm:p-10 shadow-xs space-y-5">
            <p className="text-xs uppercase tracking-[0.2em] text-paper-burgundy">
              Safety, Care & Transparency
            </p>
            <h1 className="font-serif italic text-4xl text-paper-text">
              Privacy & Community Guidelines
            </h1>

            <div className="space-y-4 text-sm text-paper-text/90 leading-relaxed">
              <div>
                <h2 className="font-serif italic text-xl text-paper-burgundy">1. Private Letters Stay Private</h2>
                <p className="mt-1">
                  Letters saved as Private, Drafts, or Future Time-Capsules are stored locally in your browser’s storage on this device and are never transmitted or published to the public community without your explicit action.
                </p>
              </div>

              <div>
                <h2 className="font-serif italic text-xl text-paper-burgundy">2. Anonymous Community Publishing & Moderation</h2>
                <p className="mt-1">
                  When you voluntarily submit a letter to the community, it is paired with a poetic display alias and placed into moderation review before appearing publicly. Please never include full names, phone numbers, home addresses, or email addresses in public submissions.
                </p>
              </div>

              <div>
                <h2 className="font-serif italic text-xl text-paper-burgundy">3. Kindness Standards</h2>
                <p className="mt-1">
                  This space is dedicated to empathy, nostalgia, and human reflection. Abusive, harassing, hateful, or harmful content is strictly prohibited and removed during moderation or upon reader report.
                </p>
              </div>

              <div className="pt-4 border-t border-paper-rose/35">
                <h2 className="font-serif italic text-xl text-paper-burgundy">Manage Your Local Data</h2>
                <p className="mt-1 mb-3">
                  You may erase all saved favorites, private letters, drafts, and local preferences stored in this browser at any time.
                </p>
                <button
                  type="button"
                  onClick={() => {
                    onClearAllLocalData();
                    setCleared(true);
                  }}
                  className="px-5 py-2 rounded-full border border-red-300 bg-red-50 text-red-800 text-xs font-medium hover:bg-red-100 transition"
                >
                  Clear All Local Letters & Preferences
                </button>
                {cleared && (
                  <p className="mt-2 text-xs text-paper-burgundy italic">
                    All local drafts, private letters, and saved favorites have been cleared.
                  </p>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    /* ============================================================================
       14. MAIN APP SHELL, NAVIGATION & STATE ORCHESTRATION
       ============================================================================ */
    function App() {
      const [page, setPage] = useState('home');
      const [activeLetter, setActiveLetter] = useState(null);
      const [editingDraft, setEditingDraft] = useState(null);

      // Persistent state in localStorage
      const [savedIds, setSavedIds] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('lts_saved_ids') || '[1, 7]');
        } catch (e) {
          return [1, 7];
        }
      });

      const [personalLetters, setPersonalLetters] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('lts_personal_letters') || '[]');
        } catch (e) {
          return [];
        }
      });

      const [communityLetters, setCommunityLetters] = useState(() => {
        try {
          const stored = localStorage.getItem('lts_community_letters');
          return stored ? JSON.parse(stored) : INITIAL_COMMUNITY_LETTERS;
        } catch (e) {
          return INITIAL_COMMUNITY_LETTERS;
        }
      });

      const [lettersState, setLettersState] = useState(INITIAL_LETTERS);
      const [userReactions, setUserReactions] = useState([]);

      useEffect(() => {
        try {
          localStorage.setItem('lts_saved_ids', JSON.stringify(savedIds));
        } catch (e) {}
      }, [savedIds]);

      useEffect(() => {
        try {
          localStorage.setItem('lts_personal_letters', JSON.stringify(personalLetters));
        } catch (e) {}
      }, [personalLetters]);

      useEffect(() => {
        try {
          localStorage.setItem('lts_community_letters', JSON.stringify(communityLetters));
        } catch (e) {}
      }, [communityLetters]);

      // Deterministic Daily Letter based on calendar day
      const dailyLetter = useMemo(() => {
        const now = new Date();
        const dayIndex = Math.floor(now.getTime() / (1000 * 60 * 60 * 24));
        return lettersState[dayIndex % lettersState.length];
      }, [lettersState]);

      const navigateTo = (target) => {
        setPage(target);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleToggleSave = (id) => {
        setSavedIds((prev) =>
          prev.includes(id) ? prev.filter((item) => item !== id) : [...prev, id]
        );
      };

      const handleAddReaction = (letterId, reaction) => {
        const key = `${letterId}:${reaction}`;
        setUserReactions((prev) =>
          prev.includes(key) ? prev.filter((k) => k !== key) : [...prev, key]
        );
      };

      const handleAddReply = (letterId, text) => {
        const alias = ANONYMOUS_ALIASES[Math.floor(Math.random() * ANONYMOUS_ALIASES.length)];
        const newReply = { id: `rep-${Date.now()}`, author: alias, text };

        setLettersState((prev) =>
          prev.map((l) =>
            l.id === letterId ? { ...l, replies: [...(l.replies || []), newReply] } : l
          )
        );
        setCommunityLetters((prev) =>
          prev.map((l) =>
            l.id === letterId ? { ...l, replies: [...(l.replies || []), newReply] } : l
          )
        );
        setActiveLetter((prev) =>
          prev && prev.id === letterId
            ? { ...prev, replies: [...(prev.replies || []), newReply] }
            : prev
        );
      };

      const handleSavePersonal = (item) => {
        setPersonalLetters((prev) => {
          const exists = prev.some((p) => p.id === item.id);
          return exists ? prev.map((p) => (p.id === item.id ? item : p)) : [item, ...prev];
        });
      };

      const handleDeletePersonal = (id) => {
        setPersonalLetters((prev) => prev.filter((p) => p.id !== id));
      };

      const handleSubmitCommunity = (item) => {
        setCommunityLetters((prev) => [item, ...prev]);
      };

      const handleAppreciateCommunity = (id) => {
        setCommunityLetters((prev) =>
          prev.map((c) =>
            c.id === id ? { ...c, appreciations: (c.appreciations || 0) + 1 } : c
          )
        );
      };

      const handleReportCommunity = (id) => {
        setCommunityLetters((prev) =>
          prev.map((c) => (c.id === id ? { ...c, reported: true } : c))
        );
      };

      const handleModerateAction = (id, action) => {
        if (action === 'approve') {
          setCommunityLetters((prev) =>
            prev.map((c) => (c.id === id ? { ...c, status: 'approved', reported: false } : c))
          );
        } else {
          setCommunityLetters((prev) => prev.filter((c) => c.id !== id));
        }
      };

      const handleNextInReader = () => {
        if (!activeLetter) return;
        const idx = lettersState.findIndex((l) => l.id === activeLetter.id);
        const next = lettersState[(idx + 1) % lettersState.length];
        setActiveLetter(next);
      };

      const handleClearAllLocalData = () => {
        setSavedIds([]);
        setPersonalLetters([]);
        localStorage.removeItem('lts_saved_ids');
        localStorage.removeItem('lts_personal_letters');
        localStorage.removeItem('lts_scratchpad');
      };

      const NAV_ITEMS = [
        { id: 'home', label: 'Home' },
        { id: 'explore', label: 'Explore' },
        { id: 'write', label: 'Write a Letter' },
        { id: 'community', label: 'Community' },
        { id: 'my-letters', label: 'My Letters' }
      ];

      return (
        <div className="min-h-screen flex flex-col justify-between bg-paper-bg text-paper-text">
          {/* TOP MINIMAL EDITORIAL NAVIGATION */}
          <header className="sticky top-0 z-30 bg-paper-bg/85 backdrop-blur-md border-b border-paper-rose/35">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              {/* Brand Logo */}
              <button
                type="button"
                onClick={() => navigateTo('home')}
                className="flex items-center gap-2.5 text-left group focus:outline-none"
              >
                <span className="w-7 h-7 rounded-full bg-paper-burgundy text-paper-white flex items-center justify-center text-xs shadow-2xs group-hover:scale-105 transition-transform">
                  ❦
                </span>
                <span className="font-serif italic text-xl sm:text-2xl font-medium text-paper-text tracking-tight">
                  Letters to Someone
                </span>
              </button>

              {/* Desktop Navigation Links */}
              <nav aria-label="Primary Navigation" className="hidden md:flex items-center gap-7">
                {NAV_ITEMS.map((item) => {
                  const active = page === item.id;
                  return (
                    <button
                      key={item.id}
                      type="button"
                      onClick={() => navigateTo(item.id)}
                      className={`relative py-1 text-sm transition-colors ${
                        active
                          ? 'text-paper-burgundy font-medium'
                          : 'text-paper-brown hover:text-paper-text'
                      }`}
                    >
                      {item.label}
                      {active && (
                        <span className="absolute inset-x-0 -bottom-0.5 h-0.5 rounded-full bg-paper-burgundy" />
                      )}
                    </button>
                  );
                })}
              </nav>

              {/* Right Quick Icons: Daily & Saved Heart */}
              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => navigateTo('daily')}
                  className="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-paper-cream/90 border border-paper-brown/20 text-xs text-paper-text hover:border-paper-burgundy transition"
                >
                  <span>✦</span>
                  <span>Daily Letter</span>
                </button>

                <button
                  type="button"
                  onClick={() => navigateTo('my-letters')}
                  aria-label="Open saved letters"
                  className="relative p-2 rounded-full bg-paper-white/90 border border-paper-rose/45 text-paper-burgundy hover:bg-paper-pink/40 transition"
                >
                  <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z" />
                  </svg>
                  {savedIds.length > 0 && (
                    <span className="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-paper-burgundy text-paper-white text-[10px] flex items-center justify-center">
                      {savedIds.length}
                    </span>
                  )}
                </button>
              </div>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1">
            {page === 'home' && (
              <HomePage
                letters={lettersState}
                onOpenLetter={(l) => setActiveLetter(l)}
                onNavigate={navigateTo}
                dailyLetter={dailyLetter}
                savedIds={savedIds}
                onToggleSave={handleToggleSave}
              />
            )}

            {page === 'explore' && (
              <ExplorePage
                letters={lettersState}
                onOpenLetter={(l) => setActiveLetter(l)}
                savedIds={savedIds}
                onToggleSave={handleToggleSave}
              />
            )}

            {page === 'surprise' && (
              <SurpriseMePage
                letters={lettersState}
                onOpenLetter={(l) => setActiveLetter(l)}
              />
            )}

            {page === 'write' && (
              <WriteLetterPage
                onSavePersonal={handleSavePersonal}
                onSubmitCommunity={handleSubmitCommunity}
                editingDraft={editingDraft}
                onClearEditing={() => setEditingDraft(null)}
              />
            )}

            {page === 'community' && (
              <CommunityPage
                communityLetters={communityLetters}
                onOpenLetter={(l) => setActiveLetter(l)}
                onAppreciate={handleAppreciateCommunity}
                onReportLetter={handleReportCommunity}
                onModerateAction={handleModerateAction}
                onNavigate={navigateTo}
              />
            )}

            {page === 'my-letters' && (
              <MyLettersPage
                allLetters={[...lettersState, ...communityLetters]}
                savedIds={savedIds}
                personalLetters={personalLetters}
                onOpenLetter={(l) => setActiveLetter(l)}
                onToggleSave={handleToggleSave}
                onDeletePersonal={handleDeletePersonal}
                onEditDraft={(draft) => {
                  setEditingDraft(draft);
                  navigateTo('write');
                }}
                onNavigate={navigateTo}
              />
            )}

            {page === 'daily' && (
              <DailyLetterPage
                dailyLetter={dailyLetter}
                letters={lettersState}
                onOpenLetter={(l) => setActiveLetter(l)}
                savedIds={savedIds}
                onToggleSave={handleToggleSave}
              />
            )}

            {page === 'about' && <AboutPage onNavigate={navigateTo} />}

            {page === 'privacy' && (
              <PrivacyPage onClearAllLocalData={handleClearAllLocalData} />
            )}
          </main>

          {/* POETIC FOOTER */}
          <footer className="border-t border-paper-rose/40 bg-paper-cream/45 py-12 pb-24 md:pb-12">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col md:flex-row items-center justify-between gap-6 text-center md:text-left">
              <div>
                <p className="font-serif italic text-2xl text-paper-text">
                  Letters to Someone
                </p>
                <p className="text-xs text-paper-brown mt-1">
                  “A little place for words that were never sent.”
                </p>
              </div>

              <div className="flex flex-wrap justify-center gap-5 text-xs text-paper-brown">
                <button type="button" onClick={() => navigateTo('explore')} className="hover:text-paper-burgundy">
                  Explore Archive
                </button>
                <button type="button" onClick={() => navigateTo('surprise')} className="hover:text-paper-burgundy">
                  Surprise Me
                </button>
                <button type="button" onClick={() => navigateTo('daily')} className="hover:text-paper-burgundy">
                  Daily Letter
                </button>
                <button type="button" onClick={() => navigateTo('about')} className="hover:text-paper-burgundy">
                  About
                </button>
                <button type="button" onClick={() => navigateTo('privacy')} className="hover:text-paper-burgundy">
                  Privacy & Guidelines
                </button>
              </div>
            </div>
          </footer>

          {/* MOBILE COMPACT BOTTOM NAVIGATION */}
          <nav
            aria-label="Mobile Navigation"
            className="md:hidden fixed bottom-0 inset-x-0 z-30 bg-paper-white/95 backdrop-blur-md border-t border-paper-rose/45 px-2 py-1.5 flex items-center justify-around"
          >
            {[
              { id: 'home', label: 'Desk', icon: '✉️' },
              { id: 'explore', label: 'Explore', icon: '📖' },
              { id: 'write', label: 'Write', icon: '✒️' },
              { id: 'community', label: 'Strangers', icon: '🌙' },
              { id: 'my-letters', label: 'Saved', icon: '♥' }
            ].map((item) => {
              const active = page === item.id;
              return (
                <button
                  key={item.id}
                  type="button"
                  onClick={() => navigateTo(item.id)}
                  className={`flex flex-col items-center py-1 px-2.5 rounded-xl text-[11px] transition ${
                    active ? 'text-paper-burgundy font-medium bg-paper-pink/40' : 'text-paper-brown'
                  }`}
                >
                  <span className="text-sm leading-none mb-0.5">{item.icon}</span>
                  <span>{item.label}</span>
                </button>
              );
            })}
          </nav>

          {/* AMBIENT SOUND CONTROLLER */}
          <SoundControlWidget />

          {/* SIGNATURE MULTI-STEP ENVELOPE READER MODAL */}
          {activeLetter && (
            <EnvelopeReaderModal
              letter={activeLetter}
              onClose={() => setActiveLetter(null)}
              onNextLetter={handleNextInReader}
              isSaved={savedIds.includes(activeLetter.id)}
              onToggleSave={handleToggleSave}
              onAddReaction={handleAddReaction}
              onAddReply={handleAddReply}
              userReactions={userReactions}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
